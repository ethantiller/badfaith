[project]
name = "badfaith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jason Sun", email = "wenxiang.sun1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.0.0",
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
badfaith = "badfaith:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
